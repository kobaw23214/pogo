name: pogo-browser-auth-lab
services:
  bootstrap:
    image: ${LAB_APP_IMAGE:?Run lab.py build first}
    platform: ${LAB_PLATFORM:?Run lab.py init first}
    user: root
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    read_only: true
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        install -d -m 0700 -o pogo -g pogo /home/pogo/.pogo /var/lib/pogo-skills
        cp /bootstrap/providers.json /home/pogo/.pogo/providers.json
        if [ ! -f /home/pogo/.pogo/users.json ]; then cp /bootstrap/users.json /home/pogo/.pogo/users.json; fi
        chown pogo:pogo /home/pogo/.pogo/providers.json /home/pogo/.pogo/users.json
        chmod 0600 /home/pogo/.pogo/providers.json /home/pogo/.pogo/users.json
    volumes:
      - lab-home:/home/pogo
      - lab-skills:/var/lib/pogo-skills
      - ${LAB_PRIVATE_DIR:?Set the private directory}/providers.json:/bootstrap/providers.json:ro
      - ${LAB_PRIVATE_DIR:?Set the private directory}/users.json:/bootstrap/users.json:ro
    restart: "no"
  app:
    image: ${LAB_APP_IMAGE:?Run lab.py build first}
    platform: ${LAB_PLATFORM:?Run lab.py init first}
    init: true
    security_opt: ["no-new-privileges:true", "seccomp=../../seccomp-bwrap.json"]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 4g
    cpus: 3
    pids_limit: 768
    tmpfs: ["/tmp:size=1g,exec,mode=1777"]
    env_file:
      - path: ${LAB_PRIVATE_DIR}/runtime.env
        format: raw
      - path: ${LAB_PRIVATE_DIR}/model.env
        format: raw
    environment:
      POGO_PLATFORM: ${LAB_PLATFORM}
      POGO_SANDBOX: enforce
      POGO_USERS_FILE: /home/pogo/.pogo/users.json
      POGO_CONFIG: /home/pogo/.pogo/providers.json
      POGO_BROWSER_URL: http://worker:7788
      POGO_SKILL_RUNTIME_STORE: /var/lib/pogo-skills
      POGO_SKILL_RUNTIME_EXECUTOR: local
    volumes: [lab-home:/home/pogo, lab-skills:/var/lib/pogo-skills]
    ports: ["127.0.0.1:19778:7777"]
    command: ["-web", "-listen", "0.0.0.0:7777"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      worker: {condition: service_healthy}
      mock-platform: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7777/api/auth/status >/dev/null"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped
  worker:
    image: ${LAB_WORKER_IMAGE:?Run lab.py build first}
    platform: ${LAB_PLATFORM}
    init: true
    security_opt: ["no-new-privileges:true", "seccomp=../seccomp.json"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=1g,exec,mode=1777"]
    shm_size: 1g
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    env_file:
      - path: ${LAB_PRIVATE_DIR}/worker.env
        format: raw
    environment:
      POGO_BROWSER_MAX_SESSIONS: 6
      POGO_BROWSER_IDLE_MS: 1800000
      POGO_BROWSER_SETTLE_MS: 2000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7788/healthz',{headers:{Authorization:'Bearer '+process.env.POGO_BROWSER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12
    stop_grace_period: 15s
    restart: unless-stopped
  mock-platform:
    image: ${LAB_MOCK_IMAGE:?Run lab.py build first}
    platform: ${LAB_PLATFORM}
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    ports: ["127.0.0.1:5190:5190"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5190/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: unless-stopped
volumes:
  lab-home:
  lab-skills:
