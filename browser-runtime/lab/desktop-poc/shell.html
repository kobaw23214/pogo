<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pogo Desktop Browser PoC</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #20252c; background: #f4f6f8; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    header { height: 72px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #d6dce3; }
    button { border: 1px solid #c8d0d9; border-radius: 7px; padding: 9px 14px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { color: #135fc1; border-color: #4384d7; background: #e8f1ff; }
    button:focus-visible { outline: 2px solid #216bd0; outline-offset: 2px; }
    .divider { flex: 1; }
    #status { margin-left: 8px; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #586575; }
    #status.error { color: #aa3024; }
  </style>
</head>
<body>
  <header aria-label="PoC 浏览器工具栏">
    <button id="tab-A" aria-pressed="true">页面 A</button>
    <button id="tab-B" aria-pressed="false">页面 B</button>
    <span class="divider"></span>
    <button id="inspect" aria-pressed="false">引用模式</button>
    <button id="devtools" aria-pressed="false">开发者工具</button>
    <span id="status" role="status">正在打开本地测试页面…</span>
  </header>
  <script>
    const bridge = window.pogoPocShell;
    const status = document.getElementById('status');
    function render(state) {
      for (const id of ['A', 'B']) document.getElementById(`tab-${id}`).setAttribute('aria-pressed', String(state.activeTab === id));
      const tab = state.tabs.find(item => item.id === state.activeTab);
      document.getElementById('inspect').setAttribute('aria-pressed', String(Boolean(tab?.enabled)));
      document.getElementById('devtools').setAttribute('aria-pressed', String(Boolean(tab?.devtools)));
      status.className = tab?.lastError ? 'error' : '';
      status.textContent = tab?.lastError || (tab?.enabled ? `页面 ${state.activeTab} · 点击网页元素添加引用` : tab?.selected ? `页面 ${state.activeTab} · 已选择网页元素` : `页面 ${state.activeTab} · 直接浏览`);
    }
    async function invoke(action) {
      try { await action(); render(await bridge.state()); }
      catch (error) { status.className = 'error'; status.textContent = String(error.message || error).slice(0, 160); }
    }
    for (const id of ['A', 'B']) document.getElementById(`tab-${id}`).addEventListener('click', () => invoke(() => bridge.selectTab(id)));
    document.getElementById('inspect').addEventListener('click', () => invoke(() => bridge.toggleInspect()));
    document.getElementById('devtools').addEventListener('click', () => invoke(() => bridge.toggleDevtools()));
    bridge.onState(render);
    invoke(() => Promise.resolve());
  </script>
</body>
</html>
