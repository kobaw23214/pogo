<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pogo · 第二轮活动卡片隔离验证</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif}#app{max-width:1080px;margin:20px auto;padding:0 20px 70px}
    h1{font-size:21px;margin:0 0 6px}h2{font-size:15px;margin:0 0 12px}.note{font-size:12px;color:var(--el-text-color-secondary)}
    .controls{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.controls button{background:var(--el-bg-color);color:var(--el-text-color-primary);border:1px solid var(--el-border-color);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12px}
    .panel{padding:16px;border:1px solid var(--el-border-color);border-radius:10px;margin:14px 0;min-width:0}.status{font-size:12px;white-space:pre-wrap}.evidence{font:11px/1.7 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.approval-fixture{position:relative}
    @media(max-width:600px){#app{padding:0 10px 40px}.panel{padding:10px}}
  </style>
</head>
<body><div id="app"></div><script type="module" src="/dev/activity-cards.ts"></script></body>
</html>
