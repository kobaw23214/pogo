<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pogo · 总工作记录收起隔离演示</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif}#app{max-width:1050px;margin:24px auto;padding:0 20px 64px}
    h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:0 0 12px}.fixture-note{font-size:13px;line-height:1.7;color:var(--el-text-color-secondary)}
    .fixture-panel{border:1px solid var(--el-border-color);border-radius:10px;padding:16px;margin:16px 0;min-width:0}
    .fixture-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.fixture-controls button,.fixture-controls a{border:1px solid var(--el-border-color);border-radius:6px;background:var(--el-bg-color);color:var(--el-text-color-primary);padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}.fixture-controls button[aria-pressed=true]{border-color:var(--el-color-primary);color:var(--el-color-primary)}
    .fixture-status{display:block;font-size:13px;line-height:1.7;white-space:pre-wrap}.fixture-evidence{display:block;font:11px/1.8 monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto}
    .fixture-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}.fixture-table th,.fixture-table td{border-bottom:1px solid var(--el-border-color-lighter);padding:7px 6px}.fixture-table th{color:var(--el-text-color-secondary);font-weight:500}.fixture-table code{font-size:11px}.fixture-expected{font-size:13px;line-height:1.8}
    @media(max-width:600px){#app{padding:0 10px 40px}.fixture-panel{padding:10px}.fixture-table th,.fixture-table td{padding:6px 3px;font-size:11px}}
  </style>
</head>
<body><div id="app"></div><script type="module" src="/dev/worklog-collapse.ts"></script></body>
</html>
