[program:pogo-office-proxy]
command=/usr/local/bin/pogo-office-node /opt/pogo-office/docker-proxy.mjs
directory=/opt/pogo-office
user=ds
environment=POGO_OFFICE_JWT_SECRET_FILE="/run/pogo-office-private/jwt"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/onlyoffice/documentserver/pogo-office-proxy/out.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/onlyoffice/documentserver/pogo-office-proxy/err.log
stderr_logfile_maxbytes=0
